# ============================================================
# cproxy rules.conf
# Format: <type> <match> <action> <value>
#   type   : short | json | jsonp | html
#   match  : URL substring (short — URL prefix)
#   action : return | set | inject
#   value  : for short — response body; for json/jsonp — key=value;
#            for html — path to inject.js + optionally kill_ws=1
# ============================================================

# ---------- Firmware update blocking ----------
# Any request starting with http://home.imaqliq.tv/update/
# is intercepted before upstream and receives {"false"} — the set-top box
# assumes there are no updates.
short  http://home.imaqliq.tv/update/    return   false

# ---------- Payment: balance/amount spoofing ----------
# JSONP response of the form callback({...}) — we modify nested fields.
# The last path segment (amount, balance, payment) is taken
# and its value is replaced throughout the JSON.
jsonp  payment/getQRV2                   set      data.data.amount=99999
jsonp  payment/getQRV2                   set      data.data.balance=99999
jsonp  payment/getQRV2                   set      data.data.payment=99999

# ---------- Features: unlock everything ----------
# Iterate over all keys of the features object and set updated=true
json   features                          set      features.*.updated=true

# ---------- Streamers: replace with own IP ----------
# All values in streamers and streamers2 are replaced with <MY_IP>
# (substituted from the cproxy command-line argument)
# json   streamers                         set      streamers.*=<MY_IP>
# json   streamers2                        set      streamers2.*=<MY_IP>

# ---------- HTML injection ----------
# Into any HTML with id="Middleware" we insert:
#   1) a window.WebSocket shim (mutes the provider's WS -> ws://MY_IP:8765/)
#   2) the contents of inject.js before </body>
# kill_ws=1 — enable the shim.
html   id="Middleware"   inject   /usr/local/http/inject.js   kill_ws=1
html   id="auth_div"     inject   /usr/local/http/inject.js   kill_ws=1

# ---------- Fallback update interception ----------
# In case the firmware sometimes sends a relative path without http://
short  /update/                          return   false
